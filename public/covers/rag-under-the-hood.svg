    <circle cx="480" cy="490" r="8"/><circle cx="820" cy="430" r="8"/>
  </g>
  <circle cx="600" cy="400" r="16" fill="none" stroke="#c8f051" stroke-width="3"/>
  <circle cx="600" cy="400" r="34" fill="none" stroke="rgba(200,240,81,0.3)" stroke-width="1.5" stroke-dasharray="4 8"/>
  <text x="632" y="392" font-size="19" letter-spacing="3" fill="#c8f051">QUERY</text>
  <text x="80" y="120" font-size="20" letter-spacing="6" fill="rgba(255,255,255,0.4)">RETRIEVAL / TOP-K = 5</text>
